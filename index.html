<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d292d"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Orbit OS — Your little space on the web</title><link rel="stylesheet" href="style.css"></head><body>
<div class="wallpaper"><div class="planet"></div><div class="hill back"></div><div class="hill front"></div><div class="grain"></div></div>
<header class="menubar"><button id="home" aria-label="Open launcher"><b class="orbitmark">◉</b> <strong>orbit</strong><span class="os">OS</span></button><span class="menulabel">Your space. Anywhere.</span><div class="status"><span id="network">● Online</span><button id="quick" aria-label="Open settings">☷</button><time id="clock"></time></div></header>
<main id="desktop"><div class="greeting"><div class="eyebrow">A LITTLE SPACE OF YOUR OWN</div><h1>Make yourself<br>at home<span>.</span></h1><p>Your apps, ideas, and next adventure.<br>Right here in your browser.</p><button class="primary" onclick="openApp('store')">Explore apps <span>↗</span></button></div><aside class="widgets"><div class="datewidget"><span id="day"></span><b id="date"></b><span id="month"></span><div class="divider"></div><span class="widgetlabel">A fresh space.<br>A world of possibilities.</span><i>✳</i></div><button class="tip" onclick="openApp('help')"><span>↗</span><div><strong>Made for your iPad</strong><small>Add Orbit to your Home Screen</small></div></button></aside><section class="desktopapps" id="desktopapps" aria-label="Installed apps"></section><span class="edition">ORBIT OS <span> / </span> WEB EDITION 01</span></main>
<div id="windows"></div><div id="launcher" hidden><div class="launcherhead"><h2>Your apps</h2><button onclick="toggleLauncher()" aria-label="Close launcher">✕</button></div><input id="appsearch" type="search" placeholder="Search your apps…" aria-label="Search apps"><div id="launcherapps"></div></div>
<nav class="dock" aria-label="App dock"><button class="docklaunch" onclick="toggleLauncher()" aria-label="App launcher">▦</button><span class="dockline"></span><div id="dockapps"></div><span class="dockline"></span><button onclick="openApp('settings')" class="dockicon settings" aria-label="Settings">⚙</button></nav><div id="toast" role="status"></div>
<script src="app.js"></script></body></html>
